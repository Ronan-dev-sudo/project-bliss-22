<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Bliss v2</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NETFLIX INTRO -->
    <section id="netflixIntro" class="screen active">

        <div class="netflix-logo">N</div>

        <p class="loading-text">
            Loading your surprise...
        </p>

    </section>

    <!-- WELCOME -->
    <section id="welcomeScreen" class="screen">

        <div class="welcome-box">

            <h1>Hi Bliss ❤️</h1>

            <p>
                I made something special just for you.
            </p>

            <button id="startJourney">
                Begin
            </button>

        </div>

    </section>

    <!-- THEME SELECTION -->
    <section id="themeScreen" class="screen">

        <div class="theme-container">

            <h1>Choose Your Adventure ✨</h1>

            <p>
                Every choice has a little surprise waiting...
            </p>

            <div class="theme-grid">

                <div class="theme-card" id="kittyTheme">
                    <div class="emoji">💕</div>
                    <h2>XO Kitty</h2>
                    <p>
                        Cute. Pink. Cozy.
                    </p>
                </div>

                <div class="theme-card" id="kitkatTheme">
                    <div class="emoji">🍫</div>
                    <h2>KitKat</h2>
                    <p>
                        Sweet little moments.
                    </p>
                </div>

                <div class="theme-card" id="puppyTheme">
                    <div class="emoji">🐶</div>
                    <h2>Puppy</h2>
                    <p>
                        Endless happiness.
                    </p>
                </div>

                <div class="theme-card" id="movieTheme">
                    <div class="emoji">🎬</div>
                    <h2>Netflix</h2>
                    <p>
                        One final story.
                    </p>
                </div>

            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>
</html>
